[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-monitor"
version = "0.6.0"
description = "Cross-platform system monitor with TUI, web dashboard, and remote monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Salvatore Corvaglia"},
]

dependencies = [
    "psutil>=5.9.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]
all = ["raven-monitor[docker,dev]"]

[project.scripts]
raven = "raven.cli:main"

[project.urls]
Homepage = "https://github.com/salvatorecorvaglia/raven"
Documentation = "https://github.com/salvatorecorvaglia/raven#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["raven*"]

[tool.setuptools.package-data]
"raven" = ["py.typed"]
"raven.tui" = ["*.tcss"]
"raven.web" = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
